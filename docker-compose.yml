services:
  schondell-web:
    container_name: schondell-web
    build: .
    restart: unless-stopped
    networks:
      - app_default
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_default:
    external: true
