server_tokens off;
gzip on;
gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

# www -> apex. TLS and http->https are handled at the Cloudflare edge.
server {
    listen 80;
    server_name www.schondell.com;
    return 301 https://schondell.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
