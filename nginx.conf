server_tokens off;
gzip on;
gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

# The Cloudflare Tunnel delivers plain HTTP and states the visitor's scheme in X-Forwarded-Proto.
# Only an explicit "http" is redirected; requests without the header (healthcheck, direct
# in-network calls) and "https" are served. /healthz is never redirected.
map "$http_x_forwarded_proto:$uri" $redirect_to_https {
    default        0;
    "~^http:/healthz$" 0;
    "~^http:"      1;
}

# www -> apex in a single hop, whatever the scheme. TLS is terminated at the Cloudflare edge.
server {
    listen 80;
    server_name www.schondell.com;
    return 301 https://schondell.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Fixed apex host on purpose (not $host).
    if ($redirect_to_https) {
        return 301 https://schondell.com$request_uri;
    }

    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
